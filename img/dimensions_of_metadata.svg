<svg viewBox="0 0 950 655" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4472C4"/>
    </marker>
  </defs>

  <!-- vertical axis: coarse-grain (up) <-> fine-grain (down) -->
  <line x1="490" y1="335" x2="490" y2="90"
        stroke="#4472C4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="335" x2="490" y2="600"
        stroke="#4472C4" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- horizontal axis: provenance (left) <-> workflow (right) -->
  <line x1="490" y1="335" x2="225" y2="335"
        stroke="#4472C4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="335" x2="740" y2="335"
        stroke="#4472C4" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- axis labels -->
  <text x="490" y="45" text-anchor="middle" font-size="30" fill="#000000">coarse-grain</text>
  <text x="490" y="645" text-anchor="middle" font-size="30" fill="#000000">fine-grain</text>
  <text x="15" y="345" text-anchor="start" font-size="30" fill="#000000">provenance</text>
  <text x="905" y="345" text-anchor="end" font-size="30" fill="#000000">workflow</text>

  <!-- top-left quadrant: provenance + coarse-grain -->
  <text x="215" y="165" text-anchor="start" font-size="26" fill="#000000">
    <tspan x="215" dy="0">Run A of</tspan>
    <tspan x="215" dy="34">application B</tspan>
    <tspan x="215" dy="34">produced file</tspan>
    <tspan x="215" dy="34">C of type D</tspan>
  </text>

  <!-- top-right quadrant: workflow + coarse-grain -->
  <text x="575" y="165" text-anchor="start" font-size="26" fill="#000000">
    <tspan x="575" dy="0">Application B</tspan>
    <tspan x="575" dy="34">produces</tspan>
    <tspan x="575" dy="34">files of type</tspan>
    <tspan x="575" dy="34">D</tspan>
  </text>

  <!-- bottom-left quadrant: provenance + fine-grain -->
  <text x="215" y="405" text-anchor="start" font-size="26" fill="#000000">
    <tspan x="215" dy="0">Run A of</tspan>
    <tspan x="215" dy="34">application B</tspan>
    <tspan x="215" dy="34">produced</tspan>
    <tspan x="215" dy="34">values E of</tspan>
    <tspan x="215" dy="34">variable F</tspan>
  </text>

  <!-- bottom-right quadrant: workflow + fine-grain -->
  <text x="575" y="405" text-anchor="start" font-size="26" fill="#000000">
    <tspan x="575" dy="0">Application B</tspan>
    <tspan x="575" dy="34">produces</tspan>
    <tspan x="575" dy="34">values for</tspan>
    <tspan x="575" dy="34">variable F</tspan>
  </text>
</svg>
